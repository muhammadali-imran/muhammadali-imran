name: Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-profile-summary-cards
    permissions:
      contents: write 

    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Start with the built-in token (no setup needed).
          # If the run fails with an auth/permission error, create a personal
          # access token, save it as a repo secret named SUMMARY_SUMMARY_GITHUB_TOKEN,
          # and change this line to: ${{ secrets.SUMMARY_SUMMARY_GITHUB_TOKEN }}
          SUMMARY_GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: 5
          THEME: "dracula"
          ANIMATION: "load"